
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicious Apples</title>
    <style>
        
@import url('https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #08df7b;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.product {
    display: flex;
    position: relative;
    width: 685px;
    min-height: 684px;
    background: #fff;
    border-radius: 5px;
    margin-left: 0;
    margin-top: 0;
}

.product__photo {
    position: absolute;
    width: 352px;
    left: -46px;
    top: 45px;
    z-index: 2;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
}

.photo-container {
    width: 100%;
}

.photo-main {
    width: 100%;
    height: 468px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 65% 45%, #d0f85a 0%, #a4e916 75%, #98e500 100%);
}

.photo-main .controls {
    position: absolute;
    top: 16px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    font-size: 19px;
}

.photo-main img {
    display: block;
    width: 125%;
    max-width: none;
    height: auto;
    transform: translate(-1px, 3px);
    filter: drop-shadow(0 16px 10px rgba(0, 0, 0, 0.14));
}

.photo-album {
    height: 125px;
    padding: 31px 16px;
    background: #fff;
}

.photo-album ul {
    display: flex;
    justify-content: center;
    gap: 5px;
    list-style: none;
}

.photo-album li {
    width: 63px;
    height: 63px;
    flex-shrink: 0;
    border: 1px solid #d1d1d1;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.photo-album img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.product__info {
    width: 100%;
    padding: 84px 35px 40px 324px;
    color: #4c4c4c;
}

.title h1 {
    font-size: 27px;
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: -1px;
    white-space: nowrap;
    margin-bottom: 8px;
}

.title span {
    display: block;
    font-size: 12px;
    color: #aaa;
}

.price {
    color: #ff3f40;
    font-size: 21px;
    white-space: nowrap;
    margin-top: 43px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.price span {
    font-size: 64px;
    line-height: 1.2;
    font-weight: 300;
    letter-spacing: -3px;
}

.variant {
    margin-top: 37px;
}

.variant h3,
.description h3 {
    color: #a6a6a6;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 18px;
}

.variant ul {
    display: flex;
    gap: 8px;
    align-items: center;
    list-style: none;
}

.variant li {
    width: 41px;
    height: 41px;
    border: 1px solid transparent;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.variant li.selected {
    border-color: #aaa;
}

.variant img {
    width: 35px;
    height: 35px;
    object-fit: contain;
}

.description {
    margin-top: 35px;
}

.description h3 {
    margin-bottom: 12px;
}

.description ul {
    padding-left: 57px;
    font-size: 14px;
    line-height: 25px;
    white-space: nowrap;
}

.buy--btn {
    width: 208px;
    height: 61px;
    margin-top: 33px;
    background: #ff3f40;
    border: none;
    border-radius: 9px;
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(255, 63, 64, 0.24);
}

@media (max-width: 800px) {
    body {
        padding: 30px 16px;
        align-items: flex-start;
    }

    .product {
        width: 100%;
        max-width: 420px;
        min-height: 0;
        margin: 0;
        flex-direction: column;
    }

    .product__photo {
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        box-shadow: none;
    }

    .photo-main {
        height: 350px;
        overflow: hidden;
    }

    .photo-main img {
        width: 100%;
        max-width: 100%;
    }

    .photo-album {
        height: auto;
        padding: 15px;
    }

    .photo-album ul {
        gap: 8px;
    }

    .photo-album li {
        flex: 1;
        max-width: 70px;
    }

    .product__info {
        width: 100%;
        padding: 28px 24px;
    }

    .title h1 {
        white-space: normal;
    }

    .price {
        margin-top: 25px;
    }

    .variant,
    .description {
        margin-top: 25px;
    }

    .description ul {
        padding-left: 25px;
        white-space: normal;
    }

    .buy--btn {
        width: 100%;
        margin-top: 25px;
    }
}

    </style>
</head>
<body>
    <section class="product">
        <div class="product__photo">
            <div class="photo-container">
                <div class="photo-main">
                    <div class="controls">
                        <i class="fa fa-share-alt"></i>
                        <i class="fa fa-heart-o"></i>
                    </div>
                    <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537291846/codepen/delicious-apples/green-apple-with-slice.png" alt="Green apple with slice">
                </div>

                <div class="photo-album">
                    <ul>
                        <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green apple"></li>
                        <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303532/codepen/delicious-apples/half-apple.png" alt="Apple cut in half"></li>
                        <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303160/codepen/delicious-apples/green-apple-flipped.png" alt="Green apple side view"></li>
                        <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303708/codepen/delicious-apples/apple-top.png" alt="Apple top view"></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="product__info">
            <div class="title">
                <h1>Delicious Apples</h1>
                <span>CODE: 45999</span>
            </div>

            <div class="price">
                R$ <span>7.93</span>
            </div>

            <div class="variant">
                <h3>SELECT A COLOR</h3>
                <ul>
                    <li class="selected">
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green apple">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="Yellow apple">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="Orange apple">
                    </li>
                    <li>
                        <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="Red apple">
                    </li>
                </ul>
            </div>

            <div class="description">
                <h3>BENEFITS</h3>
                <ul>
                    <li>Apples are nutritious</li>
                    <li>Apples may be good for weight loss</li>
                    <li>Apples may be good for bone health</li>
                    <li>They're linked to a lowest risk of diabetes</li>
                </ul>
            </div>

            <button class="buy--btn">ADD TO CART</button>
        </div>
    </section>
</body>
</html>
